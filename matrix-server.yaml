---
- name: Base setup - update packages and install rootless nerdctl
  hosts: all
  become: true

  tasks:
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist


- name: Install rootless nerdctl
  hosts: all
  become: false

  roles:
    - role: ansible-nerdctl


- name: Deploy Matrix POC via rootless nerdctl compose
  hosts: all
  become: false

  vars:
    matrix_data_root: "{{ ansible_env.HOME }}/matrix"

    matrix_domain: "{{ hostvars[inventory_hostname].matrix_domain }}"

    postgres_password: "poc-postgres-change-me"
    registration_shared_secret: "poc-registration-secret-change-me"

    matrix_test_user: alice
    matrix_test_password: "S0meLongPocPassword!"

  tasks:

    - name: Verify that a Matrix hostname is configured
      ansible.builtin.assert:
        that:
          - matrix_domain is defined
          - matrix_domain | length > 0
        fail_msg: >
          No matrix_domain configured for {{ inventory_hostname }}.
          Add matrix_domain to the inventory.

    - name: Get uid of current user for rootless runtime dir
      ansible.builtin.command: id -u
      register: uid_result
      changed_when: false

    - name: Set rootless environment
      ansible.builtin.set_fact:
        rootless_env:
          XDG_RUNTIME_DIR: "/run/user/{{ uid_result.stdout }}"
          DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ uid_result.stdout }}/bus"

    # Rootless containers normally cannot bind privileged ports such as
    # 80/443 unless the kernel allows unprivileged users to bind them.
    # This is acceptable for this POC. A production deployment would
    # normally put Caddy outside the rootless container runtime or use
    # another controlled port-forwarding mechanism.
    - name: Allow unprivileged users to bind ports 80 and 443
      become: true
      ansible.posix.sysctl:
        name: net.ipv4.ip_unprivileged_port_start
        value: "0"
        state: present
        reload: true

    - name: Create Matrix data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
      loop:
        - "{{ matrix_data_root }}"
        - "{{ matrix_data_root }}/synapse-data"
        - "{{ matrix_data_root }}/synapse-data/media_store"
        - "{{ matrix_data_root }}/caddy"
        - "{{ matrix_data_root }}/caddy/data"
        - "{{ matrix_data_root }}/caddy/config"

    - name: Check if postgres-data already exists
      ansible.builtin.stat:
        path: "{{ matrix_data_root }}/postgres-data"
      register: pg_data_stat

    - name: Create postgres-data directory only if it does not exist
      ansible.builtin.file:
        path: "{{ matrix_data_root }}/postgres-data"
        state: directory
        mode: "0777"
      when: not pg_data_stat.stat.exists

    - name: Render homeserver.yaml
      ansible.builtin.template:
        src: homeserver.yaml.j2
        dest: "{{ matrix_data_root }}/synapse-data/homeserver.yaml"
        mode: "0644"

    - name: Render log.config
      ansible.builtin.template:
        src: log.config.j2
        dest: "{{ matrix_data_root }}/synapse-data/log.config"
        mode: "0644"

    - name: Render Element config
      ansible.builtin.template:
        src: element-config.json.j2
        dest: "{{ matrix_data_root }}/element-config.json"
        mode: "0644"

    - name: Render Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ matrix_data_root }}/caddy/Caddyfile"
        mode: "0644"

    - name: Render docker-compose.yaml
      ansible.builtin.template:
        src: docker-compose.yaml.j2
        dest: "{{ matrix_data_root }}/docker-compose.yaml"
        mode: "0640"

    - name: Start the Matrix stack
      environment: "{{ rootless_env }}"
      ansible.builtin.command:
        cmd: nerdctl compose -f {{ matrix_data_root }}/docker-compose.yaml up -d
      changed_when: true

    - name: Wait for Caddy HTTPS endpoint
      ansible.builtin.uri:
        url: "https://{{ matrix_domain }}/_matrix/client/versions"
        status_code: 200
        validate_certs: false
      register: matrix_health
      until: matrix_health.status == 200
      retries: 30
      delay: 5
      ignore_errors: true

    - name: Show Caddy logs if Matrix endpoint never came up
      environment: "{{ rootless_env }}"
      ansible.builtin.command:
        cmd: nerdctl logs matrix-caddy --tail 80
      register: caddy_logs
      when: matrix_health is failed
      changed_when: false

    - name: Show Synapse logs if Matrix endpoint never came up
      environment: "{{ rootless_env }}"
      ansible.builtin.command:
        cmd: nerdctl logs matrix-synapse --tail 80
      register: synapse_logs
      when: matrix_health is failed
      changed_when: false

    - name: Print Caddy logs
      ansible.builtin.debug:
        msg: "{{ caddy_logs.stdout_lines }}"
      when: matrix_health is failed

    - name: Print Synapse logs
      ansible.builtin.debug:
        msg: "{{ synapse_logs.stdout_lines }}"
      when: matrix_health is failed

    - name: Fail explicitly if Matrix did not come up
      ansible.builtin.fail:
        msg: >
          Matrix did not come up at
          https://{{ matrix_domain }}/_matrix/client/versions.
          See Caddy and Synapse logs above.
      when: matrix_health is failed

    - name: Register demo user
      environment: "{{ rootless_env }}"
      ansible.builtin.command: >
        nerdctl exec matrix-synapse
        register_new_matrix_user
        -u {{ matrix_test_user }}
        -p {{ matrix_test_password }}
        -a
        -c /data/homeserver.yaml
        http://localhost:8008
      register: reg_result
      changed_when: "'Success!' in reg_result.stdout"
      failed_when:
        - reg_result.rc != 0
        - "'already taken' not in (reg_result.stderr | default(''))"

    - name: Show deployment URL
      ansible.builtin.debug:
        msg:
          - "Matrix/Element: https://{{ matrix_domain }}"
          - "Test user: @{{ matrix_test_user }}:{{ matrix_domain }}"
